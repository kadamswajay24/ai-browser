<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d1a;
    color: #94a3b8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .logo { font-size: 48px; }
  h1 { font-size: 22px; color: #a78bfa; font-weight: 600; }
  p  { font-size: 13px; max-width: 320px; text-align: center; line-height: 1.6; }
  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>AI Browser</h1>
  <p>Type a URL or search term in the address bar, or open your college LMS to get started.</p>
  <p class="hint">Press Ctrl+T for a new tab &nbsp;·&nbsp; Ctrl+L to focus the address bar</p>
</body>
</html>
